<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grain, dither and halftone</title>
<link rel="stylesheet" href="/src/motion/motion.css">
<link rel="stylesheet" href="/src/motion/print.css">
<style>
  body { margin: 0; font: 18px/1.5 sans-serif; color: #111; background: #fff; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }
  .dc-print img { display: block; width: 100%; height: auto; }
  .gap { height: 1200px; }
  #moving { padding: 48px; background: #f6f6f4; }
</style>
</head>
<body>
<div class="wrap">
<div class="dc-motion dc-print dc-print--dither" id="first" data-motion="print" style="--dc-print-dark: #141414; --dc-print-light: #f6f6f4"><img src="ripple-photo.svg" alt="Stripes, a red circle and a green band" width="600" height="400"><span class="dc-print-look" aria-hidden="true"><span class="dc-print-tone"><img src="ripple-photo.svg" alt="Stripes, a red circle and a green band" width="600" height="400"><span class="dc-print-blank"></span><span class="dc-print-screen"></span></span><span class="dc-print-light"></span><span class="dc-print-dark"></span></span></div>
<div class="gap"><p>Between the photos.</p></div>
<div class="dc-motion dc-print dc-print--dither" id="dither" data-motion="print" style="--dc-print-dark: #141414; --dc-print-light: #f6f6f4"><img src="ripple-photo.svg" alt="Stripes, a red circle and a green band" width="600" height="400"><span class="dc-print-look" aria-hidden="true"><span class="dc-print-tone"><img src="ripple-photo.svg" alt="Stripes, a red circle and a green band" width="600" height="400"><span class="dc-print-blank"></span><span class="dc-print-screen"></span></span><span class="dc-print-light"></span><span class="dc-print-dark"></span></span></div>
<div class="gap"></div>
<div class="dc-motion dc-print dc-print--halftone" id="halftone" data-motion="print" style="--dc-print-dark: #d11f1f; --dc-print-light: #fff1f1"><img src="ripple-photo.svg" alt="Stripes, a red circle and a green band" width="600" height="400"><span class="dc-print-look" aria-hidden="true"><span class="dc-print-tone"><img src="ripple-photo.svg" alt="Stripes, a red circle and a green band" width="600" height="400"><span class="dc-print-blank"></span><span class="dc-print-screen"></span></span><span class="dc-print-light"></span><span class="dc-print-dark"></span></span></div>
<div class="gap"></div>
<a href="#end" id="link"><div class="dc-motion dc-print dc-print--halftone" id="linked" data-motion="print" style="--dc-print-dark: #d11f1f; --dc-print-light: #fff1f1"><img src="ripple-photo.svg" alt="Stripes, a red circle and a green band" width="600" height="400"><span class="dc-print-look" aria-hidden="true"><span class="dc-print-tone"><img src="ripple-photo.svg" alt="Stripes, a red circle and a green band" width="600" height="400"><span class="dc-print-blank"></span><span class="dc-print-screen"></span></span><span class="dc-print-light"></span><span class="dc-print-dark"></span></span></div></a>
<div class="dc-motion dc-print dc-print--grain" id="grain"><img src="ripple-photo.svg" alt="Stripes, a red circle and a green band" width="600" height="400"><span class="dc-print-look" aria-hidden="true"></span></div>
<section class="dc-motion dc-print dc-print--grain" id="moving" data-motion="grain"><h2>Grain that moves</h2><p>Over a section's words.</p><span class="dc-print-look" aria-hidden="true"></span></section>
<button type="button" class="dc-motion-toggle" aria-pressed="false" hidden>Pause motion</button>
<div class="gap" id="end"><p>The rest of the page.</p></div>
</div>
<script type="module">
  import { register } from '/src/motion/runtime.js';
  register({ print: () => import('/src/motion/print.js'), grain: () => import('/src/motion/print.js').then((module) => module.grain) });
</script>
</body>
</html>
