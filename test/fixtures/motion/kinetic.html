<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic type</title>
<link rel="stylesheet" href="/src/motion/motion.css">
<link rel="stylesheet" href="/src/motion/band.css">
<style>
  body { margin: 0; padding: 0 40px; font: 18px/1.5 sans-serif; color: #111; background: #fff; }
  h2 { font-size: 48px; line-height: 1.1; max-width: 12em; margin: 0 0 24px; }
  .gap { height: 1200px; }
  .eyebrow { font: 600 14px/1.4 sans-serif; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; }
  .dc-band { font: 800 64px/1.1 sans-serif; margin-inline: -40px; }
</style>
</head>
<body>
<div class="gap"><p>Further down the page.</p></div>
<p class="dc-motion eyebrow" id="label" data-motion="scramble">Motion library</p>
<h2>Type that moves, read as plain text by every screen reader</h2>
<div class="gap"><p>Further down again.</p></div>
<div class="dc-motion dc-band" id="band" data-motion="band"><p class="dc-band-text">Websites without the guesswork.</p></div>
<button type="button" class="dc-motion-toggle" aria-pressed="false" hidden>Pause motion</button>
<div class="gap"><p>The rest of the page.</p></div>
<script type="module">
  import { register } from '/src/motion/runtime.js';
  register({
    scramble: () => import('/src/motion/scramble.js'),
    band: () => import('/src/motion/band.js'),
  });
</script>
</body>
</html>
