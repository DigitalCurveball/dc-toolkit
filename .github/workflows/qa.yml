name: QA

# The quality gate for a Digital Curveball site, called from the site's own
# .github/workflows/qa.yml, which keeps the triggers (README, "The QA workflow").
# It runs in parallel with Cloudflare, which deploys from main independently, so a
# failure here never stops a deploy: a client's CMS save must always reach the site.
# What a red run blocks is the launch checklist, which is a human step.

on:
  workflow_call:
    inputs:
      target:
        description: build (the site), or concept (a file in concept_dir, as a baseline before porting)
        type: string
        default: build
      concept_dir:
        description: Where the concepts are
        type: string
        default: public/concepts
      concept_file:
        description: Which concept (used only when target is concept)
        type: string
        default: index.html

jobs:
  # One job: the site is installed and built once for both the checks and Lighthouse, where two
  # jobs each did it, a quarter of a run's minutes (Actions minutes ran out, 2026-10-19).
  checks:
    runs-on: ubuntu-latest
    # A pull request's merge is not checked again on main: its pull request was, on the same
    # content, and checking it twice was half of what a toolkit release cost. A push straight to
    # main, as before a launch, is checked as ever.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request ')
    # A newer run on the same branch, with the same inputs, stops this one: a run on a commit
    # already superseded tells nobody anything. The inputs are in the group so that a port's
    # concept baselines, dispatched together on main, do not stop each other.
    concurrency:
      group: qa-${{ github.ref }}-${{ inputs.target }}-${{ inputs.concept_file }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner has the system libraries a browser needs; a WSL dev machine
      # usually does not, which is why local runs need `playwright install-deps`.
      - run: pnpm exec playwright install --with-deps chromium

      - id: build
        run: pnpm build
        if: inputs.target != 'concept'

      # Writes its report to the job summary, and exits non-zero on any failure so
      # the run goes red where the developer will see it. The client never sees this.
      #
      # The concept option runs the same checks against the approved design that
      # this site was ported from, which is how "the port improved accessibility"
      # becomes a measurement rather than a claim.
      #
      # The build is checked through `pnpm qa`, so the list of pages lives in one
      # place: package.json. Add every new page there.
      - name: Accessibility and layout
        env:
          TARGET: ${{ inputs.target }}
          CONCEPT_DIR: ${{ inputs.concept_dir }}
          CONCEPT_FILE: ${{ inputs.concept_file }}
        run: |
          if [ "$TARGET" = "concept" ]; then
            pnpm exec dc-qa --dir "$CONCEPT_DIR" --path "/$CONCEPT_FILE"
          else
            pnpm qa
          fi

      # Lighthouse runs even when the checks above failed, so a run shows both, and the failed
      # step's name says which: a Lighthouse flake is plainly not an accessibility failure.
      # Budgets come from the site's lighthouserc.json: performance 95, accessibility 100, SEO 95.
      #
      # One run a page, and the first page twice. Lighthouse CI asserts the best of a page's runs
      # (its default aggregationMethod, optimistic: Math.max of the scores), grouping them by
      # URL. Three runs a page, over 41 pages of three sites, agreed within a point on every page
      # except a run's first, cold: one home page scored 88, then 100 twice, and in another run
      # 93, then 100 twice (2026-10-24; the sites are named in dc-pipeline's facts.md). So
      # the first page runs again as its own warm-up, whose worse score is dropped, and the rest
      # once: a third of the runs, which were three quarters of a run's minutes.
      #
      # The same pages as the checks: the paths in package.json's qa script, so the list lives
      # in one place. Left to find pages itself, Lighthouse takes the first five HTML files in
      # the build, which include the noindexed concepts from public/concepts/ (failing SEO by
      # design) and would skip real pages as the site grows. The action's own urls input
      # doesn't stop that when the config sets staticDistDir (tried 2026-10-02), so this writes
      # the list into a copy of the config as collect.url, which does; Lighthouse swaps in its
      # server's port.
      - name: Pages for Lighthouse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node -e "
            const config = require('./lighthouserc.json');
            const paths = require('./package.json').scripts.qa.match(/--path (\S+)/)[1].split(',');
            config.ci.collect.url = [paths[0], ...paths].map((p) => 'http://localhost' + p);
            config.ci.collect.numberOfRuns = 1;
            require('fs').writeFileSync('lighthouserc.ci.json', JSON.stringify(config, null, 2));
            console.log(config.ci.collect.url.join('\n'));
          "
      - name: Lighthouse
        id: lighthouse
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.ci.json

      # The reports only when Lighthouse failed, which is when someone reads them. Uploaded from
      # every run, at 15 to 27 MB a run on the larger sites, they held 2.4 GB against the Free
      # plan's 500 MB of Actions storage (2026-10-24). `.lighthouseci` starts with a dot, which
      # upload-artifact leaves out unless told.
      - name: Lighthouse reports, as it failed
        if: ${{ !cancelled() && steps.lighthouse.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
